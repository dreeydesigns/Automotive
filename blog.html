<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Journal & Chronicles | Range Rover & Land Rover Centre</title>
  <meta name="description" content="Editorial perspectives on Range Rover and Land Rover ownership, maintenance protocols, terrain navigation, and bespoke acquisition in Kenya." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/rrc-root.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/rrc-layout.css" />
  <link rel="stylesheet" href="css/rrc-components.css" />
</head>
<body data-page="blog" class="rrc-theme-white">

  <!-- Nav -->
  <nav class="rrc-nav" aria-label="Primary Navigation">
    <div class="rrc-container">
      <a class="rrc-brand-title" href="index.html">
        Range Rover / Land Rover Centre
      </a>
      <div class="rrc-nav-actions">
        <a class="rrc-btn rrc-btn-secondary" href="marketplace.html" style="color: #0A0A0A; border-color: #0A0A0A;">The Collection</a>
        <a class="rrc-btn rrc-btn-primary" href="contact.html">Concierge</a>
      </div>
    </div>
  </nav>

  <main class="rrc-main" style="padding-top: 72px;">
    <!-- Editorial Header (Section 34) -->
    <header class="rrc-section-editorial" style="background: #FFFFFF; border-bottom: 1px solid var(--rrc-mist);">
      <div class="rrc-container">
        <span class="rrc-mono-tag" style="color: #666;">The Journal</span>
        <h1 style="font-size: clamp(34px, 5vw, 64px); margin: 6px 0 16px; color: #0A0A0A;">
          Editorial Chronicles.
        </h1>
        <p style="max-width: 600px; font-size: 17px; color: #444;">
          Reflections on Solihull engineering, East African expedition capabilities, and verified vehicle stewardship.
        </p>
      </div>
    </header>

    <!-- Articles Grid (Section 35) -->
    <section class="rrc-section" style="background: #FFFFFF;">
      <div class="rrc-container">
        <div class="rrc-collection-grid" id="blogGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: var(--sp-5);">
          <!-- Populated dynamically via Sanity CMS -->
        </div>
      </div>
    </section>
  </main>

  <footer class="rrc-footer">
    <div class="rrc-container">
      <div class="rrc-footer-bottom">
        <span>© 2026 Range Rover / Land Rover Centre · Nairobi</span>
        <span>Ridgeways, Kiambu Road</span>
      </div>
    </div>
  </footer>

  <script src="js/vehicle-data.js"></script>
  <script src="js/rrc-reveal.js"></script>
  <script src="js/rrc-interactive.js"></script>
  <script src="js/rrc-nav.js"></script>
  <script>
    const renderPosts = (posts) => {
      const grid = document.getElementById("blogGrid");
      if (!grid) return;
      grid.innerHTML = "";

      if (!posts || posts.length === 0) {
        grid.innerHTML = `
          <div style="grid-column: 1 / -1; padding: 60px 20px; text-align: center; background: #FBFBF9; border-radius: 6px; border: 1px dashed var(--rrc-mist);">
            <span class="rrc-mono-tag">Journal Status</span>
            <h3 style="margin: 8px 0; color: #0A0A0A;">New Chronicles in Preparation</h3>
            <p style="max-width: 480px; margin: 0 auto 20px; font-size: 14px; color: #666;">Our acquisition and engineering team is currently authoring new perspectives on Solihull motorcars.</p>
            <a class="rrc-btn rrc-btn-primary" href="marketplace.html">Explore Showroom</a>
          </div>
        `;
        return;
      }

      posts.forEach(post => {
        const slug = post.slug?.current || post.slug || "#";
        const cover = post.coverImageUrl || "https://images.unsplash.com/photo-1542282088-72c9c27ed0cd?w=900&auto=format";
        const date = post.publishedAt ? new Date(post.publishedAt).toLocaleDateString("en-GB", { month: "short", day: "numeric", year: "numeric" }) : "";
        const card = document.createElement("article");
        card.className = "rrc-journey-card rrc-reveal revealed";
        card.style.background = "#F9F9F8";
        card.style.borderColor = "var(--rrc-mist)";
        card.innerHTML = `
          <div class="rrc-journey-media">
            <img src="${cover}" alt="${post.title}" loading="lazy" />
          </div>
          <div class="rrc-journey-body" style="padding: var(--sp-4);">
            <span class="rrc-mono-tag" style="color: #666;">${post.category || "Journal"} ${date ? `· ${date}` : ""}</span>
            <h3 style="font-size: 19px; color: #0A0A0A; margin: 4px 0;">${post.title}</h3>
            <p style="font-size: 13px; color: #555; margin: 0;">${post.excerpt || ""}</p>
            <div style="margin-top: 12px;">
              <a class="rrc-btn rrc-btn-secondary rrc-btn-full" href="blog-post.html?post=${encodeURIComponent(slug)}" style="color: #0A0A0A; border-color: var(--rrc-mist);">Read Chronicle →</a>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    };

    if (window.RRC_FETCH_PROMISE) {
      window.RRC_FETCH_PROMISE.then(() => {
        renderPosts(window.RRC_POSTS);
      });
    } else if (window.RRC_POSTS && window.RRC_POSTS.length > 0) {
      renderPosts(window.RRC_POSTS);
    }

    document.addEventListener("rrc:data-ready", (e) => {
      if (e.detail && e.detail.posts) renderPosts(e.detail.posts);
    });
  </script>
</body>
</html>

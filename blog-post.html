<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Article Chronicle | Range Rover & Land Rover Centre</title>
  <meta name="description" content="Editorial perspectives and ownership guides from the Range Rover & Land Rover Centre Nairobi." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/rrc-root.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/rrc-layout.css" />
  <link rel="stylesheet" href="css/rrc-components.css" />
</head>
<body data-page="blog-post" class="rrc-theme-white">

  <!-- Nav -->
  <nav class="rrc-nav" aria-label="Primary Navigation">
    <div class="rrc-container">
      <a class="rrc-brand-title" href="index.html">
        Range Rover / Land Rover Centre
      </a>
      <div class="rrc-nav-actions">
        <a class="rrc-btn rrc-btn-secondary" href="blog.html" style="color: #0A0A0A; border-color: #0A0A0A;">← All Chronicles</a>
        <a class="rrc-btn rrc-btn-primary" href="marketplace.html">The Collection</a>
      </div>
    </div>
  </nav>

  <main class="rrc-main" style="padding-top: 72px;">
    <article class="rrc-section" style="background: #FFFFFF;">
      <div class="rrc-container article-container rrc-reveal revealed" style="max-width: 800px; margin: 0 auto;">
        <span class="rrc-mono-tag green" id="postCategory" style="color: #0C3B2E;">The RRC Journal</span>
        <h1 id="postTitle" style="margin: 8px 0; color: #0A0A0A; font-size: clamp(28px, 4vw, 44px);">Article Chronicle</h1>
        <div style="font-family: var(--font-mono); font-size: 11px; color: #666; margin-bottom: var(--sp-4);" id="postMeta">RRC Editorial Desk</div>

        <div class="article-hero-media" id="postMedia" style="aspect-ratio: 16 / 9; border-radius: 6px; overflow: hidden; background: #000; margin-bottom: var(--sp-5);">
          <img id="postCover" src="https://images.unsplash.com/photo-1542282088-72c9c27ed0cd?w=1200&auto=format" alt="Article Cover" style="width: 100%; height: 100%; object-fit: cover;" />
        </div>

        <div class="article-content" id="postContent" style="font-size: 16px; line-height: 1.8; color: #333;">
          <p id="postExcerpt">Loading article details from Sanity...</p>
        </div>

        <div style="margin-top: var(--sp-6); border-top: 1px solid var(--rrc-mist); padding-top: var(--sp-4); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
          <a class="rrc-btn rrc-btn-secondary" href="blog.html" style="color: #0A0A0A; border-color: var(--rrc-mist);">← Return to Journal</a>
          <a class="rrc-btn rrc-btn-primary" href="marketplace.html">Explore Showroom</a>
        </div>
      </div>
    </article>
  </main>

  <footer class="rrc-footer">
    <div class="rrc-container">
      <div class="rrc-footer-bottom">
        <span>© 2026 Range Rover / Land Rover Centre · Nairobi</span>
        <span>Ridgeways, Kiambu Road</span>
      </div>
    </div>
  </footer>

  <script src="js/vehicle-data.js"></script>
  <script src="js/rrc-reveal.js"></script>
  <script src="js/rrc-interactive.js"></script>
  <script src="js/rrc-nav.js"></script>
  <script>
    const renderCurrentPost = (posts) => {
      if (!posts || posts.length === 0) return;
      const urlParams = new URLSearchParams(window.location.search);
      const postSlug = urlParams.get("post");

      const post = (postSlug && posts.find(p => (p.slug?.current === postSlug || p.slug === postSlug || p._id === postSlug))) || posts[0];

      if (post) {
        document.title = `${post.title} | Range Rover & Land Rover Centre`;
        const titleEl = document.getElementById("postTitle");
        const catEl = document.getElementById("postCategory");
        const metaEl = document.getElementById("postMeta");
        const coverEl = document.getElementById("postCover");
        const contentEl = document.getElementById("postContent");

        const date = post.publishedAt ? new Date(post.publishedAt).toLocaleDateString("en-GB", { month: "short", day: "numeric", year: "numeric" }) : "";
        const author = post.author || "RRC Editorial Desk";

        if (titleEl) titleEl.textContent = post.title;
        if (catEl) catEl.textContent = post.category || "The RRC Journal";
        if (metaEl) metaEl.textContent = `${author} ${date ? `· ${date}` : ""}`;
        if (coverEl && post.coverImageUrl) coverEl.src = post.coverImageUrl;
        if (contentEl) {
          contentEl.innerHTML = post.bodyText || `<p style="font-size: 17px; line-height: 1.8; color: #111;">${post.excerpt || ""}</p>`;
        }
      }
    };

    if (window.RRC_FETCH_PROMISE) {
      window.RRC_FETCH_PROMISE.then(() => {
        renderCurrentPost(window.RRC_POSTS);
      });
    } else if (window.RRC_POSTS && window.RRC_POSTS.length > 0) {
      renderCurrentPost(window.RRC_POSTS);
    }

    document.addEventListener("rrc:data-ready", (e) => {
      if (e.detail && e.detail.posts) renderCurrentPost(e.detail.posts);
    });
  </script>
</body>
</html>
